name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SVG well-formedness + size budget (per-file 60KB, per-theme README payload 400KB)
        run: node scripts/check-svgs.mjs
      - name: No third-party image hosts in README.md
        run: node scripts/check-readme-image-hosts.mjs
      - name: WCAG AA contrast, both themes
        run: node scripts/check-contrast.mjs
