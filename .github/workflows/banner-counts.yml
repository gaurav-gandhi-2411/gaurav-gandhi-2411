name: Banner counts

# The banner's "N projects · M live" clause is generated from gg-portfolio's
# content/products.ts by scripts/build-assets.mjs (a dev-time script: it needs
# Python + fontTools, which a scheduled job should not depend on). This
# workflow is the read-only half: it checks the committed banners against the
# site's counts as they are right now, using two independent sources (the
# parsed products.ts and the text the production site renders), and fails the
# run on drift, on disagreement between the sources, or when either source
# cannot be fetched or parsed. It never commits anything.
#
# Kept out of ci.yml on purpose: a live fetch in the required PR checks would
# turn a product added on the site into a red build on every unrelated PR. The
# stub-server tests do run in ci.yml.

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/site-counts.mjs"
      - "scripts/check-banner-counts.mjs"
      - "scripts/build-assets.mjs"
      - "tests/**"
      - "assets/banner-*.svg"
      - ".github/workflows/banner-counts.yml"

concurrency:
  group: banner-counts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests (stub servers and fixtures, no live data)
        run: node --test tests/*.test.mjs
      - name: Committed banners match the site's counts (live fetch of both sources)
        run: node scripts/check-banner-counts.mjs
