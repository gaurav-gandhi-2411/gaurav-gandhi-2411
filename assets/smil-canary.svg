<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SMIL animation canary">
  <rect width="600" height="120" rx="12" fill="#0A0B0D"/>
  <text x="20" y="30" font-family="monospace" font-size="14" fill="#EDEEF0">SMIL canary — all four elements below should move</text>

  <!-- 1. animate: opacity pulse, 3s -->
  <circle cx="60" cy="75" r="14" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="110" font-family="monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">animate</text>

  <!-- 2. animateTransform: rotation, 6s -->
  <g transform="translate(180 75)">
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#818CF8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="180" y="110" font-family="monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">animateTransform</text>

  <!-- 3. animateMotion: dot along a path, 5s -->
  <path d="M 280 90 C 320 40, 380 40, 420 90" fill="none" stroke="#374151" stroke-width="1"/>
  <circle r="6" fill="#818CF8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 280 90 C 320 40, 380 40, 420 90"/>
  </circle>
  <text x="350" y="110" font-family="monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">animateMotion</text>

  <!-- 4. set: color flips after 4s -->
  <circle cx="520" cy="75" r="14" fill="#EF4444">
    <set attributeName="fill" to="#22C55E" begin="4s"/>
  </circle>
  <text x="520" y="110" font-family="monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">set (red→green @4s)</text>

  <!-- 5. control: CSS keyframes — expected possibly dead per repo history -->
  <style>@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}.css-test{animation:slide 2s linear infinite alternate}</style>
  <rect class="css-test" x="440" y="20" width="10" height="10" fill="#F59E0B"/>
  <text x="470" y="45" font-family="monospace" font-size="10" fill="#9CA3AF">css control</text>
</svg>
